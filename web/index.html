<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="EcoTrace: Intelligent Electronic Waste Recovery and Circular Economy Management System.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EcoTrace">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>EcoTrace</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #f7faf8;
      color: #17352a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #ecotrace-loading {
      min-height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .ecotrace-loading-card {
      padding: 32px;
      max-width: 420px;
    }
    .ecotrace-mark-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 18px;
      background: #e8f5ee;
      border-radius: 24px;
    }
    .ecotrace-mark {
      width: 72px;
      height: 72px;
      display: block;
    }
    .ecotrace-spinner {
      width: 34px;
      height: 34px;
      margin: 22px auto;
      border: 4px solid #cce5da;
      border-top-color: #167d57;
      border-radius: 50%;
      animation: ecotrace-spin .8s linear infinite;
    }
    @keyframes ecotrace-spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div id="ecotrace-loading" role="status" aria-live="polite">
    <div class="ecotrace-loading-card">
      <div class="ecotrace-mark-badge">
        <img class="ecotrace-mark" src="icons/Icon-192.png" alt="" aria-hidden="true">
      </div>
      <h1>EcoTrace</h1>
      <div class="ecotrace-spinner" aria-hidden="true"></div>
      <p id="ecotrace-loading-message">Loading the application…</p>
    </div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      document.getElementById('ecotrace-loading')?.remove();
    });
    window.setTimeout(function () {
      const message = document.getElementById('ecotrace-loading-message');
      if (message) message.textContent = 'Still loading. The first debug launch can take longer on a slow network…';
    }, 15000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
